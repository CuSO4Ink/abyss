{
  "schema": "abyss.agents.v1",
  "purpose": "Declare pluggable Abyss agents that must use Prompt Package input, provider execution, result files, and Harness boundaries.",
  "agents": {
    "harness": {
      "enabled": true,
      "description": "Reviews action proposals, ChangeSets, LLM outputs, and Harness boundary risks without approving or executing actions.",
      "provider": "deepseek",
      "default_provider_interface": "http_openai_chat_completion_v1",
      "role": "harness_review",
      "role_prompt": "prompts/agents/harness_agent.md",
      "output_schema": "abyss.harness_review.v1",
      "input_scope": [
        "target_action_proposal",
        "target_changeset",
        "latest_llm_result",
        "policy_snapshot",
        "capability_registry",
        "deterministic_validation",
        "harness_snapshot",
        "system_map_excerpt"
      ],
      "allowed": [
        "read",
        "analyze",
        "summarize",
        "propose_review"
      ],
      "forbidden": [
        "execute_action",
        "approve_review",
        "reject_review",
        "approve_changeset",
        "reject_changeset",
        "apply_changeset",
        "modify_policy",
        "modify_prompt",
        "modify_files",
        "send_external_message"
      ]
    },
    "self_evolution": {
      "enabled": true,
      "description": "Analyzes evolution requests and proposes bounded self-iteration plans without modifying files or approving work.",
      "provider": "deepseek",
      "default_provider_interface": "http_openai_chat_completion_v1",
      "role": "self_evolution_planning",
      "role_prompt": "prompts/agents/self_evolution_agent.md",
      "output_schema": "abyss.evolution_analysis.v1",
      "input_scope": [
        "evolution_request",
        "roadmap_snapshot",
        "system_map_excerpt",
        "constitution_excerpt"
      ],
      "allowed": [
        "read_prompt_package",
        "analyze",
        "summarize",
        "propose_plan"
      ],
      "forbidden": [
        "execute_action",
        "approve_roadmap_item",
        "reject_roadmap_item",
        "modify_policy",
        "modify_prompt",
        "modify_files",
        "send_external_message",
        "schedule_work",
        "run_commands",
        "git_operation"
      ]
    },
    "implementation": {
      "enabled": true,
      "description": "Generates proposed abyss.change_set.v1, abyss.context_request.v1, or abyss.blocked_result.v1 records for approved roadmap/evolution targets without executing, approving, or modifying files directly.",
      "provider": "deepseek",
      "default_provider_interface": "http_openai_chat_completion_v1",
      "role": "implementation_changeset_planning",
      "role_prompt": "prompts/agents/implementation_agent.md",
      "output_schema": ["abyss.change_set.v1", "abyss.context_request.v1", "abyss.blocked_result.v1"],
      "input_scope": [
        "approved_evolution_or_roadmap_target",
        "roadmap_snapshot",
        "capability_registry",
        "system_brief",
        "module_manifest",
        "context_pack",
        "selected_repository_context"
      ],
      "allowed": [
        "read_prompt_package",
        "analyze",
        "produce_changeset"
      ],
      "forbidden": [
        "execute_action",
        "approve_roadmap_item",
        "reject_roadmap_item",
        "approve_changeset",
        "reject_changeset",
        "apply_changeset",
        "modify_policy",
        "modify_governance",
        "modify_prompt",
        "modify_files_directly",
        "send_external_message",
        "schedule_work",
        "run_commands",
        "git_operation"
      ]
    },
    "brain": {
      "enabled": true,
      "experimental": true,
      "description": "Internal coordinator: builds system understanding, detects trigger conditions, drives the Outbox Pattern by writing needs, integrates external fulfillment results, and drafts candidate evolution proposals for Owner approval. Brain Agent v1 has no execution, approval, file mutation, scheduling, or governance authority.",
      "provider": "deepseek",
      "default_provider_interface": "http_openai_chat_completion_v1",
      "role": "brain_agent_v1_internal_coordinator",
      "role_prompt": "prompts/agents/brain_agent.md",
      "output_schema": ["abyss.brain_context.v1", "abyss.brain_tick.v1", "abyss.brain_intake.v1", "abyss.brain_propose.v1", "abyss.brain_brief.v1", "abyss.direction_alignment_view.v1", "abyss.context_request.v1", "abyss.blocked_result.v1", "abyss.external_work_feedback_card.v1", "human_readable_status_brief"],
      "input_scope": [
        "ABYSS.md",
        "architecture_cognition",
        "system_brief",
        "system_map",
        "module_capsules",
        "contracts",
        "summary",
        "integrity_result",
        "disclosure_audit",
        "memory_records",
        "outbox_state",
        "roadmap_current",
        "workflows_reports_when_needed",
        "external_feedback_cards_when_needed"
      ],
      "allowed": [
        "read",
        "analyze",
        "summarize",
        "explain_current_state",
        "judge_phase",
        "propose_next_step",
        "write_outbox_needs",
        "read_outbox_fulfillments",
        "draft_evolution_proposal",
        "prepare_external_task_brief",
        "compress_external_results_into_feedback_cards"
      ],
      "forbidden": [
        "execute_action",
        "approve_roadmap_item",
        "reject_roadmap_item",
        "approve_changeset",
        "reject_changeset",
        "apply_changeset",
        "modify_files",
        "modify_policy",
        "modify_governance",
        "modify_prompt",
        "bypass_harness",
        "replace_owner",
        "schedule_work",
        "run_commands",
        "git_operation",
        "make_outbound_calls",
        "treat_suggestions_as_approved_tasks",
        "start_infinite_loop"
      ]
    }
  }
}
