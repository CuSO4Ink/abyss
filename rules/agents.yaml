{
  "schema": "abyss.agents.v1",
  "purpose": "Declare pluggable Abyss agents that must use Prompt Package input, provider execution, result files, and Harness boundaries.",
  "agents": {
    "harness": {
      "enabled": true,
      "description": "Reviews action proposals, LLM outputs, and Harness boundary risks without approving or executing actions.",
      "provider": "cli",
      "role": "harness_review",
      "role_prompt": "prompts/agents/harness_agent.md",
      "output_schema": "abyss.harness_review.v1",
      "input_scope": [
        "target_action_proposal",
        "latest_llm_result",
        "policy_snapshot",
        "harness_snapshot",
        "system_map_excerpt"
      ],
      "allowed": [
        "read",
        "analyze",
        "summarize",
        "propose_review"
      ],
      "forbidden": [
        "execute_action",
        "approve_review",
        "reject_review",
        "modify_policy",
        "modify_prompt",
        "modify_files",
        "send_external_message"
      ]
    },
    "self_evolution": {
      "enabled": true,
      "description": "Analyzes evolution requests and proposes bounded self-iteration plans without modifying files or approving work.",
      "provider": "cli",
      "role": "self_evolution_planning",
      "role_prompt": "prompts/agents/self_evolution_agent.md",
      "output_schema": "abyss.evolution_analysis.v1",
      "input_scope": [
        "evolution_request",
        "roadmap_snapshot",
        "system_map_excerpt",
        "constitution_excerpt"
      ],
      "allowed": [
        "read_prompt_package",
        "analyze",
        "summarize",
        "propose_plan"
      ],
      "forbidden": [
        "execute_action",
        "approve_roadmap_item",
        "reject_roadmap_item",
        "modify_policy",
        "modify_prompt",
        "modify_files",
        "send_external_message",
        "schedule_work",
        "run_commands",
        "git_operation"
      ]
    }
  }
}
