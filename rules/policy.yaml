{
  "schema": "abyss.policy.v1",
  "risk_levels": {
    "L0": "Pure computation or formatting with no state change.",
    "L1": "Read-only access to explicitly allowed local context.",
    "L2": "Append-only or create-only writes inside low-risk Abyss artifact paths.",
    "L3": "Overwrite, modify existing files, prompt changes, memory changes, or rule candidates.",
    "L4": "Git commits/pushes, external messages, network writes, or public side effects.",
    "L5": "Secrets, destructive deletion, system paths, credential exfiltration, or unauthorized network effects."
  },
  "decisions": {
    "L0": "allow",
    "L1": "allow",
    "L2": "allow",
    "L3": "review",
    "L4": "review",
    "L5": "deny"
  },
  "path_constraints": {
    "deny_absolute_or_repo_escape": true,
    "sensitive_patterns": [
      ".env",
      "secret",
      "secrets",
      "token",
      "credential",
      "credentials",
      "id_rsa",
      "id_ed25519",
      ".pem",
      ".key"
    ],
    "safe_create_prefixes": [
      "artifacts/drafts/",
      ".local/runtime/process/imports/"
    ]
  },
  "capabilities": {
    "deny": [
      "secret.read",
      "credential.export",
      "fs.delete.system",
      "network.untrusted_write"
    ],
    "review_l4": [
      "git.commit",
      "git.push",
      "outbound.message"
    ],
    "review_l3": [
      "fs.modify",
      "fs.overwrite",
      "policy.change",
      "prompt.change",
      "memory.write"
    ],
    "allow_l0": [
      "summarize",
      "reason",
      "prompt.build"
    ],
    "allow_l1": [
      "fs.read",
      "git.diff",
      "git.status"
    ]
  },
  "write_rules": {
    "fs.write": {
      "safe_operations": [
        "create",
        "append"
      ],
      "safe_prefix_risk": "L2",
      "outside_safe_prefix_risk": "L3"
    }
  },
  "default_risk": "L3"
}
