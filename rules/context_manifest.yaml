  "task_coverage_manifest_schema": {
    "description": "Schema for task_coverage_manifest declarations in proposal/roadmap records. Proposals may declare expected files and domains so Context Broker can emit deterministic advisory warnings when declared targets are absent or malformed.",
    "allowed_fields": [
      "expected_files",
      "expected_domains",
      "inferred_task_type",
      "inference_method"
    ],
    "required_fields": ["expected_files", "expected_domains"],
    "field_definitions": {
      "expected_files": "List of relative file paths that the task expects to be included in the context pack for safe implementation.",
      "expected_domains": "List of module/domain names (matching keys in modules.yaml) that the task expects to be represented in the context pack.",
      "inferred_task_type": "Optional deterministic task type inferred from context_manifest task_type_detection.",
      "inference_method": "Optional deterministic method label explaining how the manifest was inferred."
    },
    "field_types": {
      "expected_files": "list[str]",
      "expected_domains": "list[str]",
      "inferred_task_type": "str",
      "inference_method": "str"
    },
    "validation_behavior": "deterministic_structural_validation_and_comparison",
    "authority": "advisory_warning_only",
    "fail_fast_enabled": false,
    "no_semantic_retrieval": true,
    "no_execution_authority": true
  },
  "fallback": {
    "description": "When task type cannot be determined, include these baseline modules",
    "required_modules": [
      "cli_entry",
      "workflow",
