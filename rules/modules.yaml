{
    "schema": "abyss.module_manifest.v2",
    "purpose": "Structured capsule map of Abyss modules. Used by Context Broker and future Brain Agent to understand module responsibilities, boundaries, records, validation, and disclosure before reading source code.",
    "capsule_required_fields": [
        "files",
        "responsibility",
        "inputs",
        "outputs",
        "permissions",
        "dependencies",
        "risk_level",
        "validation",
        "failure_modes",
        "observability",
        "runtime_records",
        "allowed_callers",
        "forbidden_actions",
        "invariants"
    ],
    "modules": {
        "cli_entry": {
            "files": [
                "abyss_cli/__main__.py"
            ],
            "responsibility": [
                "argparse command registration and routing",
                "CLI subcommand dispatch",
                "user-facing output formatting"
            ],
            "inputs": [
                "command line arguments",
                "record ids",
                "file paths"
            ],
            "outputs": [
                "stdout summaries",
                "delegated module calls"
            ],
            "permissions": [
                "route_to_modules",
                "format_local_output"
            ],
            "dependencies": [
                "all command handler modules"
            ],
            "risk_level": "medium",
            "validation": [
                "python -m abyss_cli --help",
                "python -m abyss_cli check"
            ],
            "failure_modes": [
                "command not registered",
                "wrong argument mapping",
                "business logic accidentally embedded in CLI"
            ],
            "observability": [
                "command output",
                "audit events from delegated modules"
            ],
            "runtime_records": [],
            "allowed_callers": [
                "human_owner",
                "local_cli"
            ],
            "forbidden_actions": [
                "perform_business_logic_directly",
                "bypass_module_boundaries",
                "grant_approval_or_execution_authority"
            ],
            "related_commands": [
                "intent",
                "prompt",
                "llm",
                "result",
                "evolution",
                "workflow",
                "owner",
                "changeset",
                "summary",
                "agent",
                "check",
                "external"
            ],
            "invariants": [
                "All new CLI commands must be registered here",
                "No business logic in routing — delegate to modules"
            ]
        },
        "agent_runner": {
            "files": [
                "abyss_cli/agent_runner.py"
            ],
            "responsibility": [
                "Build prompt packages for each agent type",
                "Invoke LLM provider with prompt package",
                "Parse agent outputs into structured records"
            ],
            "inputs": [
                "agent id",
                "target record",
                "context pack",
                "provider config"
            ],
            "outputs": [
                "agent run record",
                "provider result file",
                "parsed candidate records"
            ],
            "permissions": [
                "build_prompt_package",
                "invoke_configured_provider",
                "write_runtime_agent_records"
            ],
            "dependencies": [
                "context_broker",
                "llm_executor",
                "rules/agents.yaml",
                "rules/llm_providers.yaml"
            ],
            "risk_level": "medium",
            "validation": [
                "python -m abyss_cli agent run harness --target latest",
                "python -m abyss_cli check"
            ],
            "failure_modes": [
                "provider failure",
                "invalid structured output",
                "oversized context",
                "missing role prompt"
            ],
            "observability": [
                ".local/runtime/process/agent_runs/",
                ".local/runtime/process/prompt_packages/",
                ".local/runtime/process/llm_results/",
                ".local/runtime/audit/audit.md"
            ],
            "runtime_records": [
                ".local/runtime/process/agent_runs/",
                ".local/runtime/process/prompt_packages/",
                ".local/runtime/process/llm_results/"
            ],
            "allowed_callers": [
                "workflow",
                "human_owner",
                "local_cli"
            ],
            "forbidden_actions": [
                "execute_actions",
                "approve_changesets",
                "modify_files_directly",
                "bypass_harness_or_owner"
            ],
            "related_agents": [
                "harness",
                "self_evolution",
                "implementation"
            ],
            "invariants": [
                "Agent runner never executes actions",
                "All agent runs produce audit records"
            ]
        },
        "workflow": {
            "files": [
                "abyss_cli/workflow.py"
            ],
            "responsibility": [
                "Roadmap execution state machine",
                "Orchestrate: implementation → dry-run → harness → owner → executor",
                "Handle blocked/failed/retry states"
            ],
            "inputs": [
                "approved roadmap/proposal target",
                "workflow id",
                "changeset id",
                "owner decision",
                "stage retry request"
            ],
            "outputs": [
                "workflow record",
                "owner inbox item",
                "execution trigger after approval",
                "report record"
            ],
            "permissions": [
                "advance_workflow_state",
                "request_agent_runs",
                "request_dry_run",
                "create_owner_inbox_item",
                "continue_after_owner_approval"
            ],
            "dependencies": [
                "agent_runner",
                "changeset",
                "harness_review",
                "owner",
                "summary",
                "integrity"
            ],
            "risk_level": "high",
            "validation": [
                "python -m abyss_cli workflow list",
                "python -m abyss_cli check",
                "python -m abyss_cli summary --check"
            ],
            "failure_modes": [
                "stale state",
                "broken changeset reference",
                "missing owner item",
                "dry-run failure",
                "provider output invalid",
                "execution failure"
            ],
            "observability": [
                ".local/runtime/process/workflows/",
                ".local/runtime/process/reports/",
                ".local/runtime/audit/audit.md"
            ],
            "runtime_records": [
                ".local/runtime/process/workflows/",
                ".local/runtime/process/reports/"
            ],
            "allowed_callers": [
                "human_owner",
                "local_cli",
                "owner_after_approval"
            ],
            "forbidden_actions": [
                "apply_without_owner_approval",
                "skip_dry_run",
                "skip_harness_review",
                "silently_ignore_blockers"
            ],
            "states": [
                "implementation_pending",
                "implementation_running",
                "changeset_proposed",
                "dry_run_passed",
                "harness_review_running",
                "waiting_owner_approval",
                "approved_for_execution",
                "executing",
                "checking",
                "done",
                "failed",
                "blocked",
                "rejected"
            ],
            "invariants": [
                "Cannot apply changeset without owner approval",
                "Blocked state must expose reason",
                "Terminal states: done, failed, blocked, rejected"
            ]
        },
