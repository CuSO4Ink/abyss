{
  "schema": "abyss.llm_providers.v2",
  "purpose": "Configure local LLM executor providers without embedding secrets.",
  "local_override_path": ".local/llm_providers.json",
  "interfaces": {
    "stdin_prompt_package_stdout_response_v1": {
      "description": "Abyss sends the complete Prompt Package to the provider process on stdin. The provider must write exactly the LLM response body to stdout and exit with code 0. Non-zero exit code or empty stdout is treated as provider failure.",
      "stdin": "complete Prompt Package text encoded as UTF-8",
      "stdout": "complete LLM response text encoded as UTF-8",
      "stderr": "diagnostics only; surfaced on failure",
      "model_switching": "Optional standard CLI model selection: when providers.<name>.model is non-empty, Abyss appends [model_argument, model] to the configured command before invoking it. model_argument defaults to --model. Provider adapters that support model switching should accept this argv convention.",
      "retry": "Optional bounded retry configuration: timeout_seconds controls each attempt, max_attempts defaults to 1 and is capped at 3, retry_backoff_seconds applies a short linear backoff between timeout or empty-stdout failures. Non-zero exit codes and process start failures are not retried.",
      "side_effects": "Provider may call an LLM service, but must not modify Abyss files directly. Abyss is responsible for saving result files and importing action proposals."
    },
    "http_json_prompt_package_response_v1": {
      "description": "Abyss sends the complete Prompt Package to an HTTP endpoint as JSON. The endpoint must return JSON containing the complete LLM response body in a configured string field, defaulting to response.",
      "method": "POST",
      "request_headers": {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      "request_body": {
        "schema": "abyss.llm_api_request.v1",
        "prompt_package": "complete Prompt Package text encoded as UTF-8 JSON string",
        "metadata": {
          "prompt_package_path": "absolute or provider-visible path string",
          "provider_interface": "http_json_prompt_package_response_v1"
        }
      },
      "response_body": {
        "response": "complete LLM response text encoded as UTF-8 JSON string"
      },
      "response_json_path": "Dot path to response text field; default: response",
      "auth": "Use bearer_token_env or headers in .local/llm_providers.json. Never hardcode secrets in tracked files.",
      "side_effects": "Provider may call an LLM service, but must not modify Abyss files directly. Abyss is responsible for saving result files and importing action proposals."
    }
  },
  "providers": {
    "cli": {
      "enabled": true,
      "interface": "stdin_prompt_package_stdout_response_v1",
      "description": "Standard CLI provider. The command reads the prompt package from stdin and writes the LLM response to stdout.",
      "command": [],
      "model": "",
      "model_argument": "--model",
      "timeout_seconds": 300,
      "max_attempts": 1,
      "retry_backoff_seconds": 2
    },
    "api": {
      "enabled": false,
      "interface": "http_json_prompt_package_response_v1",
      "description": "Standard HTTP JSON API provider. Configure url, optional headers, optional bearer_token_env, and optional response_json_path in .local/llm_providers.json.",
      "url": "",
      "headers": {},
      "bearer_token_env": "",
      "response_json_path": "response",
      "timeout_seconds": 300
    }
  },
  "security": {
    "no_hardcoded_secrets": true,
    "secret_sources": [
      "environment variables controlled by the user",
      ".local/llm_providers.json ignored by Git"
    ],
    "executor_boundary": "Providers may produce text and action proposals only. Abyss imports proposals through the existing result pipeline and never executes actions automatically."
  }
}
