[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abyss-cli"
version = "0.1.0"
description = "Harness-first local AI orchestration CLI MVP"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "CuSO4Ink" }
]
dependencies = []

[project.scripts]
abyss = "abyss_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["abyss_cli*"]
