    "request_type": "governance_mutation",
    "title": "Align edit-plan anchor contract for real-provider output",
    "summary": "A real-provider E2E probe showed that one provider placed replace_anchor anchor text under target.anchor while the current compiler only accepts top-level edit.anchor. This request records an owner-requested meta iteration to clarify the canonical contract and add bounded compiler compatibility without changing approval, apply, or workflow authority.",
    "affected_governance_surface": "Self Evolution edit-plan contract, Implementation Agent output contract, Patch Compiler validation boundary",
    "current_problem": "The Implementation Agent prompt mentions target.path and symbol or anchor but only shows a replace_symbol example. The compiler reads edit.get('anchor') for replace_anchor and append_after_anchor, so a reasonable target.anchor placement from a real provider fails with EDIT_PLAN_CONTRACT_MISSING_ANCHOR even though the output is otherwise structurally valid.",
    "proposed_change": "Keep top-level edit.anchor as the canonical contract, explicitly document that target must contain path only, add a replace_anchor example, and make the compiler accept target.anchor as a compatibility alias when top-level anchor is absent. If both top-level anchor and target.anchor are present and differ, reject the plan with an explicit conflicting-anchor contract error.",
    "old_rule_review": "Existing governance requires Implementation Agent outputs to be deterministic edit-plan contracts and forbids bypassing proposal, dry-run, Harness review, Owner approval, and apply gates. This change does not weaken those gates; it only aligns field parsing with a real-provider ambiguity while preserving a canonical form.",
    "risk_assessment": "Low-to-moderate contract parsing risk. Compatibility may accept an additional anchor location, but it still requires a unique exact anchor in the target file and produces the same fs.replace_exact operation. Conflicting anchors are rejected to avoid ambiguous edits.",
    "owner_authority_impact": "No new owner authority is delegated. Test or provider success remains evidence only and does not approve, apply, commit, or activate changes. Owner approval gates remain unchanged.",
    "rollback_plan": "Revert the helper and call-site changes in abyss_cli/patch_compiler.py, revert the Implementation Agent prompt clarification, and remove the added regression tests. Existing top-level anchor plans continue to work without this compatibility alias.",
    "validation_plan": "Run targeted edit-plan compiler tests, compileall, full pytest, and python -m abyss_cli check. Confirm target.anchor compiles, conflicting anchors are rejected, and canonical top-level anchor remains supported.",
    "activation_policy": "Candidate implementation only in this cycle. No workflow, approval, apply, or provider-routing changes are activated by the meta packet itself.",
